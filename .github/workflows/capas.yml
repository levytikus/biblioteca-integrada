name: Baixar capas
on:
  workflow_dispatch:
    inputs:
      lista:
        description: "Uma linha por capa: nome|url (PDF: url terminada em .pdf ou com prefixo pdf:)"
        required: true
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar
        env:
          LISTA: ${{ inputs.lista }}
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils >/dev/null || echo "sem poppler"
          mkdir -p saida && cd saida
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          : > relatorio.txt
          printf '%s\n' "$LISTA" | while IFS='|' read -r nome url; do
            [ -z "$nome" ] && continue
            case "$url" in
              pdf:*) url="${url#pdf:}"; tipo=pdf;;
              *.pdf|*.PDF) tipo=pdf;;
              *) tipo=img;;
            esac
            if [ "$tipo" = pdf ]; then
              if curl -fsSL -A "$UA" -m 180 -o "$nome.pdf" "$url" && pdftoppm -f 1 -l 1 -r 200 -jpeg "$nome.pdf" "$nome"; then
                echo "OK $nome" >> relatorio.txt
              else
                echo "FALHOU $nome $url" >> relatorio.txt
              fi
              rm -f "$nome.pdf"
            else
              code=$(curl -sSL -A "$UA" -m 60 -o "$nome.bin" -w '%{http_code}' "$url" || echo 000)
              echo "$code $nome $(file -b "$nome.bin" | cut -c1-60)" >> relatorio.txt
            fi
          done
          cat relatorio.txt
      - name: Guardar no ramo capas-brutas
        run: |
          cd saida
          git init -q -b capas-brutas
          git -c user.name=capas -c user.email=capas@users.noreply.github.com add -A
          git -c user.name=capas -c user.email=capas@users.noreply.github.com commit -q -m "capas brutas"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capas-brutas
